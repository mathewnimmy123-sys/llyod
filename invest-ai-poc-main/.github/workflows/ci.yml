name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + golden-set tests (no LLM, no network, no secrets)
        run: pytest -q
      # Next stages (not wired yet): LLM routing/faithfulness evals on a schedule using a
      # secret key, then `gcloud run deploy` via Workload Identity Federation on main.
